# USB test stick: FAT partition with flashforge_init.sh (stock runs it at
# boot), then our root filesystem as ext4.
image usbboot.vfat {
	vfat {
		label = "AD5XUSB"
		files = { "flashforge_init.sh", "README.txt" }
	}
	size = 64M
}

image usb-test.img {
	hdimage {
		partition-table-type = "mbr"
		align = 1M
	}
	partition usbboot {
		partition-type = 0xC
		image = "usbboot.vfat"
	}
	partition root {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
