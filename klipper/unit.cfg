# Per-printer calibration, from the stock settings file.
# Source: stock defaults (no settings file)
# Written by ad5x-unit-cfg; edit by hand if needed (it is only
# generated when this file doesn't exist).
[gcode_macro _AD5X_UNIT]
description: Per-printer calibration values (read by other macros)
# leftExtruderOffset.zProbeOffset: Z offset tuned on the screen; applied at print start
variable_z_offset: 0.0
# leftExtruderOffset.CutXOffset: cutter position, X (cut at X -2.5 + this)
variable_cut_x_offset: 0.0
# leftExtruderOffset.CutYOffset: cutter position, Y (cut at Y -7.5 + this)
variable_cut_y_offset: 0.0
# leftExtruderOffset.xOffset: purge box position, X
variable_x_offset: 0.0
# leftExtruderOffset.yOffset: purge box position, Y
variable_y_offset: 0.0
gcode:
  RESPOND MSG="unit: z_offset={z_offset}, cut_x_offset={cut_x_offset}, cut_y_offset={cut_y_offset}, x_offset={x_offset}, y_offset={y_offset}"
