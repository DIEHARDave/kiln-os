# This printer's Klipper config (Kiln OS).
#
# The factory defaults (hardware, stock behaviour) come from the read-only
# system image and update with it. It ends with this printer's editable
# macros (macros/*.cfg: print start, prime line, quick actions; updates
# refresh them, keeping edited ones as .bak files) and the plugins enabled
# in plugins.cfg (docs/config-layout.md, docs/plugins.md). Put your own
# lasting settings in local.cfg.
[include /usr/share/ad5x/config/ad5x.cfg]

# Per-printer calibration, written once from stock's settings file.
[include unit.cfg]

# This printer's own settings and overrides (nozzle size, tuning, ...).
# Read last, so values here win over the defaults.
[include local.cfg]

# Klipper's SAVE_CONFIG adds the bed mesh and other calibration results
# below. Note: it can't change an option the defaults already set (for
# example PID values from PID_CALIBRATE); copy those into local.cfg.
