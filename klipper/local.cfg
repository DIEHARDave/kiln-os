# This printer's own settings (not stock, not the project defaults).
# Read last by printer.cfg, so anything here overrides the defaults above
# it, the macros/ files and plugins included. Created once at first boot
# and never overwritten by image updates: the place for lasting changes
# (macros/ files are refreshed by updates). Example: no mesh before every
# print.
#
#[gcode_macro PRINT_START]
#variable_mesh_every_print: 0
#
# A different nozzle: set it with SET_NOZZLE_SIZE SIZE=0.6 (or the touch
# screen: Settings > Nozzle Size, or the setup wizard), which keeps it in
# nozzle.cfg. A nozzle_diameter set here wins over that.
#
# A bigger nozzle can flush faster at colour changes (stock 300 mm/min,
# about 12 mm3/s). Measure the flush length with IFS_PURGE_TEST.
#[ifs]
#flush_speed: 480
