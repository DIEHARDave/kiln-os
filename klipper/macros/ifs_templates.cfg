# macros/ifs_templates.cfg: IFS swap templates beyond stock (Kiln OS).
#
# Editable defaults (docs/config-layout.md; header of print_start.cfg).
# An update with a new version replaces this file and keeps an edited copy
# as ifs_templates.cfg.bak-<date> (CONFIG_BACKUPS). Changes that must
# survive updates go in local.cfg.
#
# The stock swap templates (before_gcode, cut_gcode, unload_gcode,
# purge_start_gcode, purge_gcode, after_gcode) are in the factory
# /usr/share/ad5x/config/ifs.cfg. A template here (or in local.cfg) is an
# option of [ifs] like there: the later definition replaces the whole
# template, all its lines. Parameters: docs/plugin-api.md. Templates must
# not call IFS_* commands.

[ifs]
# Swap without purge (the slicer purges: nopoop modes 0/2, Bambufy
# _NOPOOP, IFS_SWAP PURGE=0), after the prime feed at the purge box: wipe
# the bead off on the box edge and leave the box. No fan, no waits: this
# runs at every colour change of a prime-tower print.
prime_gcode:
  {% set y_off = printer['gcode_macro _AD5X_UNIT'].y_offset %}
  M400
  G90
  G1 Y220 F12000
  G1 Y{229 + y_off} F3000
  G1 Y220 F12000
  M400
