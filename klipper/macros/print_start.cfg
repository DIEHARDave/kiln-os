# macros/print_start.cfg: this system's print start (Kiln OS).
#
# Editable defaults in the printer's config directory, read after the
# factory config (/usr/share/ad5x/config/ad5x.cfg, which has the stock
# PRINT_START) and before plugins, unit.cfg and local.cfg
# (docs/config-layout.md). Edit it in Fluidd (Configuration, macros/).
# A system update that brings a new version replaces this file; if you
# edited it, your copy is kept next to it as print_start.cfg.bak-<date>
# (CONFIG_BACKUPS lists them). Changes that must survive updates go in
# local.cfg, e.g.
#   [gcode_macro PRINT_START]
#   variable_mesh_every_print: 0
# Deleting this file brings back the stock print start (it isn't copied
# again).

# Same steps and order as the stock start (docs/print-start.md), plus:
# - a new mesh of the print area every print (zMod's print_leveling: 1
#   with KAMP) instead of the stock centre Z check against an old mesh;
# - the first tool, when already loaded, purges once at the box instead
#   of a cut and reload;
# - a prime line in front of the objects when no tool is loaded
#   (macros/prime_line.cfg);
# - a status line on the screen for each step.
#
# Slicer start G-code, e.g. (OrcaSlicer placeholders):
#   PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer] TOOL=[initial_tool]
# BED, EXTRUDER: temperatures (default 60 / 220). TOOL: first slicer tool,
# loaded from the IFS channel the tool map names (TOOL+1 unless
# IFS_MAP_TOOL changed it; omit or -1 without the IFS).
# LEVEL=1|0: new bed mesh / the stock centre Z check for this print
#   (default: mesh_every_print).
# ADAPTIVE=1|0: the mesh covers only the print area / the whole bed
#   (default: adaptive_mesh). The print area comes from the slicer's object
#   labels ([exclude_object]); without labels the whole bed is probed.
# SOAK=<seconds>: bed heat soak before the Z check (default: from how far
#   the bed had to heat, see soak_per_degree; 0 = none). Set it when the
#   slicer's start G-code heats the bed before PRINT_START (M190): the bed
#   is hot at the start then, which counts as "no soak needed".
# The saved Z offset (variables.cfg zoffset) is applied on top of the new
# mesh, as on top of the old one.
[gcode_macro PRINT_START]
description: Home, heat, purge, brush, mesh the print area (or Z check), prime line or first tool
# 1 = mesh before every print (LEVEL=0 in a file skips it), 0 = stock
# centre Z check against the saved full mesh (LEVEL=1 meshes)
variable_mesh_every_print: 1
# 1 = that mesh covers only the print area, 0 = the whole bed (5x5)
variable_adaptive_mesh: 1
# mm retracted after the purge at the box (the prime line puts it back)
variable_retract: 3
# Bed heat soak before the Z check / mesh: the plate's surface keeps
# warming (and growing) for minutes after the sensor reads the target.
# With a calibration (BED_SOAK_CALIBRATE BED=<temp>, saved per temperature)
# its measured settle time is used; without one, soak_per_degree seconds
# per degree the bed rose (0 = no soak). At most soak_max seconds; the time
# since the bed reached its temperature (purge, brushing) counts. A bed
# that was already hot (within 5 C) gets none. SOAK=<seconds> in a file
# overrides it. soak_mode "probe": instead of waiting that time, probe
# until Z stops moving (soak_points 1 = centre, 5 = also the corners), at
# most that time.
variable_soak_per_degree: 3
variable_soak_max: 600
variable_soak_mode: "time"
variable_soak_points: 1
gcode:
  # No EXTRUDER=/BED=: the temperature the file already set (a slicer's own
  # M104/M140 before the start line), else 220 / 60
  {% set bed = params.BED|default(printer.heater_bed.target if printer.heater_bed.target > 0 else 60)|float %}
  {% set nozzle = params.EXTRUDER|default(printer.extruder.target if printer.extruder.target > 0 else 220)|float %}
  {% set tool = params.TOOL|default(-1)|int %}
  {% set level = params.LEVEL|default(mesh_every_print)|int %}
  {% set adaptive = params.ADAPTIVE|default(adaptive_mesh)|int %}
  {% set bed_from = printer.heater_bed.temperature %}
  CLEAR_PAUSE
  M104 S0
  M140 S0
  G90
  M82
  M106 S0
  BED_MESH_CLEAR
  _SET_GCODE_OFFSET Z=0
  SET_GCODE_VARIABLE MACRO=_CHECK_Z_APPLY VARIABLE=drift VALUE=0
  _PRINT_STATUS MSG="Homing"
  G28
  _PURGE_BOX
  _PRINT_STATUS MSG="Heating"
  M140 S{bed}
  G1 Z5 F600
  M104 S{nozzle}
  # Heat to the bed temperature, never wait for it to cool down: M190 waits
  # until within 2 C either way, and this heavy bed loses about 1 C a minute.
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  {% if 'ad5x_soak' in printer %}
    BED_SOAK_START BED={bed} FROM={bed_from} SECONDS={params.SOAK|default('')} PER_DEGREE={soak_per_degree} MAX={soak_max} MODE={soak_mode} POINTS={soak_points}
  {% endif %}
  M109 S{nozzle}
  # Purge 90 mm, retract, wipe; then cool to 180 and brush twice.
  _PRINT_STATUS MSG="Purging at the box"
  M106 S0
  G92 E0
  G1 E90 F300
  M400
  M106 S125
  G4 P3000
  G92 E0
  G1 E-{retract} F300
  _PURGE_WIPE
  M104 S180
  _NOZZLE_BRUSH
  _NOZZLE_BRUSH
  {% if 'ad5x_soak' in printer %}
    BED_SOAK_WAIT
  {% endif %}
  # Front-edge probe and scrub ("Cleaning nozzle on the bed edge": the
  # nozzle runs just above the bed's front edge, it isn't printing), then
  # the mesh (LEVEL) or the centre Z check.
  _CHECK_Z MESH={level} ADAPTIVE={adaptive}
  G90
  G1 Z50 F3000
  _PRINT_STATUS MSG="Heating"
  M140 S{bed}
  M109 S{nozzle}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
  G92 E0
  {% if tool >= 0 and 'ifs' in printer %}
    _PRINT_STATUS MSG="Loading first colour"
    _PRINT_START_TOOL CHANNEL={printer.ifs.tool_map[tool|string]|default(tool + 1)}
  {% elif 'gcode_macro _PRIME_LINE' in printer %}
    # No tool load (which purges at the box): prime line.
    _PRIME_LINE
  {% endif %}
  _PRINT_STATUS

# Load the first tool. Stock always loads it fresh from an empty toolhead
# (1 purge round); if it is already loaded here, purge once at the box.
[gcode_macro _PRINT_START_TOOL]
gcode:
  {% set chan = params.CHANNEL|int %}
  {% if printer.ifs.channel == chan %}
    _PURGE_BOX
    M83
    G1 E90 F300
    G1 E-3 F300
    M82
    G92 E0
    _PURGE_WIPE
  {% else %}
    IFS_SWAP CHANNEL={chan}
  {% endif %}
