# nopoop plugin (plugin.json, README.md).
#
# zMod's purge modes for colour changes during a print, taken from the
# save variable use_trash_on_print, which slicer profiles for zMod set in
# their start G-code (SAVE_VARIABLE VARIABLE=use_trash_on_print VALUE=n):
#   0  "nopoop": the slicer's prime tower takes the purge
#   2  "slicer-controlled purge": the slicer flushes at the purge box
#      (_GOTO_TRASH, G1 E..., _SBROS_TRASH)
#   1  (or not set) the printer purges at the box, as without the plugin
# With 0 or 2 a tool change cuts, unloads and loads as usual, then only
# fills the nozzle (prime_length in [ifs], 12 mm) at the box and wipes.
# Outside a print every swap purges. The value stays in variables.cfg
# until a file sets another one, as on zMod.
# Idea and mode numbers: zMod and ninjamida's nopoop / QuickSwap plugins;
# the swap itself is klipper/extras/ifs.py.

[ifs]
purge_mode_variable: use_trash_on_print
