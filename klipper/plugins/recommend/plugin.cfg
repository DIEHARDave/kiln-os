# recommend plugin (plugin.json, README.md).
#
# The values of zMod's "recommend" plugin that apply to this config: the
# nozzle-contact probe ([probe] on the bed's strain gauges) probes slower
# and lifts at 5 mm/s, bed meshes travel at Z 2 and split moves every
# 5 mm, and corners are taken slower (square_corner_velocity 9 instead of
# 25). zMod's other recommend values touch its own macros and files and
# have no counterpart here. Read after ad5x.cfg, before unit.cfg and
# local.cfg (those still win).

[printer]
square_corner_velocity: 9

[probe]
speed: 2
lift_speed: 5

[bed_mesh]
horizontal_move_z: 2
move_check_distance: 5
