# Kiln OS: updates offered in Fluidd (Settings > Software updates).
# Read before the printer's own moonraker.conf (S62moonraker), so a
# section there overrides this (docs/updates.md). Klipper and Moonraker
# are part of the system image and change with Kiln OS updates.

[update_manager]
# No package manager on this system
enable_system_updates: False
# Hours between checks (Fluidd's refresh button checks at once)
refresh_interval: 24

# Fluidd's release zip from GitHub, into the copy nginx serves.
# S61ad5x-web makes the copy from the image's Fluidd (/usr/share/fluidd)
# when it is missing or older than the image's.
[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: /data/ad5x/web/fluidd

# Kiln OS itself (components/kiln_os.py): the newest release on the update
# server; Update downloads it and reboots into the recovery OS to install
# it. Releases are public on GitHub; another server (GitHub or Gitea) and
# a read token for a private repository can be set here.
[kiln_os]
server: https://github.com
repo: djvalic/kiln-os
token_file: /data/ad5x/kiln-os.token
